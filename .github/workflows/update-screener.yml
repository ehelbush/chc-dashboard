name: Daily Data Sync

on:
  schedule:
    # Run daily at 10 PM ET (3 AM UTC next day) — after market close
    - cron: '0 3 * * 1-5'
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 200   # full run is ~90 min; leaves room for throttle backoff

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install yfinance numpy pandas requests

      # ── Schwab Sync (portfolio history + account data) ──
      - name: Write Schwab tokens
        if: env.SCHWAB_TOKENS != ''
        env:
          SCHWAB_TOKENS: ${{ secrets.SCHWAB_TOKENS }}
        run: echo "$SCHWAB_TOKENS" > schwab_tokens.json

      - name: Run Schwab sync
        id: schwab
        if: env.SCHWAB_APP_KEY != ''
        continue-on-error: true   # keep the screener running even if Schwab is down
        env:
          SCHWAB_APP_KEY: ${{ secrets.SCHWAB_APP_KEY }}
          SCHWAB_APP_SECRET: ${{ secrets.SCHWAB_APP_SECRET }}
          SCHWAB_TOKENS: ${{ secrets.SCHWAB_TOKENS }}
        run: python schwab_sync.py

      - name: Flag Schwab sync failure
        if: steps.schwab.outcome == 'failure'
        run: echo "::warning title=Schwab sync failed::Account/NAV data may be stale. Re-authenticate locally with python3 schwab_auth.py"

      - name: Update Schwab tokens secret
        if: hashFiles('schwab_tokens.json') != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_TOKEN" ] && [ -f schwab_tokens.json ]; then
            gh secret set SCHWAB_TOKENS < schwab_tokens.json || echo "Could not update tokens secret"
          fi

      # ── Market Screener (ticker model scores) ──
      - name: Run market screener
        id: screener
        continue-on-error: true   # still commit Schwab data; the gate below fails the run
        env:
          PYTHONUNBUFFERED: "1"   # show progress/backoff lines live instead of in 8 KB chunks
        run: python fetch_all_tickers.py

      - name: Flag screener failure
        if: steps.screener.outcome == 'failure'
        run: echo "::warning title=Market screener failed::Coverage floor not met or Yahoo throttled the run. Previous market_screener.json kept; see the screener step log for the error breakdown."

      # ── Commit results ──
      - name: Check for changes
        id: check
        run: |
          if git diff --quiet data/ 2>/dev/null; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Daily data sync $(date +%Y-%m-%d)"
          git push

      # ── Gates: fail the run (loudly) if the screener failed or account data is too old ──
      # Run last so the data commit above always lands first.
      - name: Screener gate
        if: always() && steps.screener.outcome == 'failure'
        run: |
          echo "::error title=Market screener failed::Screener did not clear the coverage floor (SCREENER_MIN_TICKERS, default 4000). Previous data kept."
          exit 1

      - name: Schwab data staleness gate
        if: always()
        run: |
          python3 - <<'PY'
          import json, sys
          from datetime import datetime, timezone
          try:
              d = json.load(open('data/schwab_cache.json'))
              ts = d.get('synced_at')
              age = (datetime.now(timezone.utc) - datetime.fromisoformat(ts)).total_seconds() / 86400
              print(f"Schwab cache synced_at={ts} ({age:.1f} days old)")
              if age > 4:
                  print(f"::error title=Schwab data stale::Account data is {age:.0f} days old. Re-authenticate: python3 schwab_auth.py")
                  sys.exit(1)
          except Exception as e:
              print(f"::error title=Staleness check failed::{e}")
              sys.exit(1)
          PY
